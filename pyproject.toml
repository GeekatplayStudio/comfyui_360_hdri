[project]
name = "comfyui-blender-toolbox"
description = "A complete toolbox for 3D Gen, HDRI, PBR, and Blender synchronization in ComfyUI."
version = "2.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "imageio[ffmpeg,freeimage]>=2.37.4,<3",
    "numpy>=2.2.6,<3; python_version < '3.11'",
    "numpy>=2.4.6,<3; python_version >= '3.11' and python_version < '3.12'",
    "numpy>=2.5.1,<3; python_version >= '3.12'",
    "requests>=2.34.2,<3",
    "keyring>=25.7.0,<26",
    "pillow>=12.3.0,<13",
    "trimesh>=4.12.2,<5",
    "scipy>=1.15.3,<2; python_version < '3.11'",
    "scipy>=1.17.1,<2; python_version >= '3.11' and python_version < '3.12'",
    "scipy>=1.18.0,<2; python_version >= '3.12'"
]

[project.urls]
Repository = "https://github.com/GeekatplayStudio/ComfyUI_Blender_toolbox"

[tool.comfy]
PublisherId = "GeekatplayStudio"
DisplayName = "ComfyUI Blender Toolbox"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
